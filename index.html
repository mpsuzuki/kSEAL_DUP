<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <title>Omitted Glyph Names in SealSources.txt</title>
  <style>
    #dropZone {
      width: 100%;
      max-width: 700px;
      height: 150px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      border: 2px dashed #888;
      border-radius: 8px;

      background: #f8f8f8;
      color: #444;

      font-family: sans-serif;
    }

    #dropZone.dragover {
      background: #e8f2ff;
      border-color: #0066cc;
    }

    .advancedContents {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5em;
    }

    .advancedExpanded {
      max-height: 0px;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 1s ease,
        opacity 0.5s ease;
    }

    details[open] .advancedContents {
      max-height: 200px;
      opacity: 1;
    }

    #output {
      font-size: 24px;
    }
  </style>
</head>
<body>

  <h1>Lookup Omitted Glyph Names from SealSources.txt</h1>

  <div id="dropZone">
    <div>
      Drop SealSources.txt here, or click to select a file in your computer.
      <input type="file" id="fileInput" hidden>
    </div>
    <div id="advanced">
      <details id="advancedDetails" class="advancedContents">
        <summary>Advanced</summary>
        <div class="advancedContents advancedExpanded">
          <input type="text" size="92" id="urlInput">
          <button id="fetchUrlButton">Fetch</button>
        </div>
      </details>
    </div>
  </div>

  <hr>

  <pre id="output"></pre>

  <script>
    const URL_GH_UNICODE_TOOLS = "https://raw.githubusercontent.com/unicode-org/unicodetools"
    const URL_GH_UCD = URL_GH_UNICODE_TOOLS + "/main/unicodetools/data/ucd";
    const URL_GH_SEALSRC = URL_GH_UCD + "/dev/SealSources.txt";
    const elemOutput = document.getElementById("output");


    const elemDropZone = document.getElementById("dropZone");
    elemDropZone.addEventListener("dragover", (evt) => {
      evt.preventDefault();
      elemDropZone.classList.add("dragover");
    });
    elemDropZone.addEventListener("dragleave", (evt) => {
      elemDropZone.classList.remove("dragover");
    });
    elemDropZone.addEventListener("drop", async (evt) => {
      evt.preventDefault();
      elemDropZone.classList.remove("dragover");

      if (evt.dataTransfer.files.length === 0)
        return;

      const file = evt.dataTransfer.files[0];
      if (!file)
        return;

      elemOutput.textContent = "";
      const text = await file.text();
      elemOutput.textContent += ("# " + text.length.toString().padStart(7, " ") + " bytes text loaded from local file\n");
      summarize(text);
    });
    elemDropZone.addEventListener("click", (evt) => {
      document.getElementById("fileInput").click();
    });


    const elemAdvanced = document.getElementById("advanced");
    elemAdvanced.addEventListener("click", (evt) => {
      evt.stopPropagation();
    });

    async function typeIntoInput(elem, text) {
      elem.value = "";
      for (const ch of text) {
        elem.value += ch;
        await new Promise(rslv => setTimeout(rslv, 8));
      }
    }
    const elemUrlInput = document.getElementById("urlInput");
    const elemAdvancedDetails = document.getElementById("advancedDetails");
    elemAdvancedDetails.addEventListener("toggle", (evt) => {
      if (elemAdvancedDetails.open && urlInput.value === "") {
        typeIntoInput(elemUrlInput, URL_GH_SEALSRC);
      }
    });


    // Load from local file
    document.getElementById("fileInput").addEventListener(
      "change",
      async (evt) => {
        const file = evt.target.files[0];
        if (!file)
          return;

        elemOutput.textContent = "";
        const text = await file.text();
        elemOutput.textContent += ("# " + text.length.toString().padStart(7, " ") + " bytes text loaded from local file\n");
        summarize(text);
      }
    );

    // Load from URL
    document.getElementById("fetchUrlButton").addEventListener(
      "click",
      async () => {
        const url = document.getElementById("urlInput").value.trim();

        if (!url)
          return;

        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          elemOutput.textContent = "";
          const text = await response.text();
          elemOutput.textContent += ("# " + text.length.toString().padStart(7, " ") + " bytes text loaded from network\n");
          summarize(text);
        } catch (error) {
          elemOutput.textContent = `Failed to load URL: ${error.message}`;
        }
      }
    );

    function summarize(text) {
      const parsedData = parseSealSources(text);
      elemOutput.textContent += "#\n";
      const summary = summarizeOmittedGlyphs(parsedData);
      display(summary);
      return summary;
    }

    // Parse SealSources-style text data
    function parseSealSources(text) {
      const data = {};

      let numLines = 0;
      for (const line of text.split(/\r?\n/)) {
        numLines += 1;
        const trimmed = line.trim();

        // Skip empty lines and comments
        if (trimmed.length === 0 || trimmed.startsWith("#"))
          continue;

        // Extract:
        // code point, property name, value field
        const match = trimmed.match(/^(\S+)\s+(\S+)\s+(.+)$/);
        if (!match)
          continue;

        const [, codePoint, property, valueText] = match;

        if (!data[codePoint])
          data[codePoint] = { codePoint };

        const values = valueText.trim().split(/\s+/);
        data[codePoint][property] = (values.length === 1) ? values[0] : values;
      }
      elemOutput.textContent += ("# " + numLines.toString().padStart(7, " ") + " lines parsed\n");
      elemOutput.textContent += ("# " + Object.keys(data).length.toString().padStart(7, " ") + " codepoints defined\n");

      return data;
    }

    // Display result
    function display(summary) {
      for (const [src, p2g] of Object.entries(summary)) {
        for (const [prfx, gs] of Object.entries(p2g)) {
          if (gs.length === 0)
            continue;
          let comment = "# In the source " + src + ", " + prfx + "glyphs have " + String(gs.length) + " omissions\n";
          elemOutput.textContent += comment;
          // elemOutput.textContent += (gs.join(", ") + "\n");
          elemOutput.textContent += (gs.join("\n") + "\n");
          elemOutput.textContent += "#\n";
        }
      }
    }

    // Collect glyph names as Set() object of each source
    function collectGlyphNames(data) {
      const src2glyphs = new Map();
      for (const [ucs, dic] of Object.entries(data)) {
        for (const [propName, propValue] of Object.entries(dic)) {
          if (!propName.endsWith("Src"))
            continue;
          const src = propName.split("_", 2).pop().slice(0,-3);
          if (!src2glyphs.has(src)) {
            src2glyphs.set(src, new Set());
          }

          src2glyphs.get(src).add(propValue);
        }
      }
      return src2glyphs;
    }

    function synthesizeGlyphNames(prefix, maxValidSequence, sequenceWidth) {
      const glyphNames = new Set();
      for (let i = 1; i <= maxValidSequence; i++) {
        glyphNames.add(
          prefix + String(i).padStart(sequenceWidth, "0")
        );
      }
      return glyphNames;
    }

    function createPrefix2Glyphs(setGlyphs) {
      const prefix2glyphs = new Map();
      setGlyphs.forEach(gn => {
        const prefix = gn.replace(/[0-9]+$/, "");
        if (!prefix2glyphs.has(prefix)) {
          prefix2glyphs.set(prefix, new Set());
        }
        prefix2glyphs.get(prefix).add(gn);
      });
      return prefix2glyphs;
    }

    function summarizeOmittedGlyphs(data) {
      const summary = {};
      const src2glyphsPerPrefix = new Map();
      const _s2g = collectGlyphNames(data);
      for (const [srcName, setGlyphs] of _s2g.entries()) {
        src2glyphsPerPrefix.set(srcName, createPrefix2Glyphs(setGlyphs));
      }
      for (const [srcName, prefix2glyphs] of src2glyphsPerPrefix.entries()) {
        summary[srcName] = {};
        for (const [prefix, setGlyphsCoded] of prefix2glyphs.entries()) {
          const sortedGlyphs = Array.from(setGlyphsCoded).sort((a, b) => a - b);
          const lastGlyph = sortedGlyphs.pop();
          const lastSequence = lastGlyph.substring(prefix.length);
          const setGlyphsSynthesized = synthesizeGlyphNames(prefix, parseInt(lastSequence), lastSequence.length);
          const setGlyphsOmitted = setGlyphsSynthesized.difference(setGlyphsCoded);
          const arrGlyphsOmitted = Array.from(setGlyphsOmitted).sort((a, b) => a - b);
          summary[srcName][prefix] = arrGlyphsOmitted;
        }
      }
      return summary;
    }


  </script>

</body>
</html>
